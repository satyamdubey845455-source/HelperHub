# =============================================
# FitTrack Backend — Application Properties
# =============================================

spring.application.name=fittrack-backend
server.port=8080

# ---- Database ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fittrack_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Satyam1}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- JWT ----
fittrack.jwt.secret=${JWT_SECRET:FitTrackSuperSecretKey2024XyZ9!@#abcdefghijklmnopqrstuvwxyz0123456789}
fittrack.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION:86400000}
fittrack.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION:2592000000}

# ---- CORS ----
fittrack.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---- Logging ----
logging.level.com.fittrack=INFO
logging.level.org.springframework.security=WARN
logging.level.root=WARN

# ---- Jackson ----
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false
