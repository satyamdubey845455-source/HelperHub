<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelperHub - Dashboard</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <!-- Navbar -->
  <nav>
    <div class="logo" onclick="window.location.href='/'" style="cursor:pointer">HelperHub</div>

    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/#services">Services</a>
      <a href="/#helpers">Helpers</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </div>

    <div id="auth-nav-container">
      <button class="nav-btn" onclick="handleLogout()">Logout</button>
    </div>
  </nav>

  <!-- Main Dashboard Container -->
  <div class="dashboard-container">
    
    <!-- Profile Card (Sidebar) -->
    <div class="profile-card" id="profile-card-container">
      <div class="profile-header">
        <img class="profile-avatar" id="user-avatar" src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png" alt="Profile">
        <h3 id="user-name">Loading...</h3>
        <span id="user-role">-</span>
      </div>
      
      <div class="profile-details">
        <div class="profile-item">
          <label>Email Address</label>
          <p id="user-email">...</p>
        </div>
        <div class="profile-item">
          <label>Phone Number</label>
          <p id="user-phone">...</p>
        </div>
        
        <!-- Helper-specific items (shown dynamically) -->
        <div id="helper-profile-details" style="display: none;">
          <div class="profile-item">
            <label>Service Type</label>
            <p id="helper-service">...</p>
          </div>
          <div class="profile-item">
            <label>Experience</label>
            <p id="helper-experience">...</p>
          </div>
          <div class="profile-item">
            <label>Hourly Rate</label>
            <p id="helper-rate">...</p>
          </div>
          <div class="profile-item">
            <label>Location</label>
            <p id="helper-location">...</p>
          </div>
          <div class="profile-item">
            <label>Rating</label>
            <p id="helper-rating">★★★★★ (5.0)</p>
          </div>
          <div class="profile-item">
            <label>Description</label>
            <p id="helper-desc" style="font-size: 13px; line-height: 1.5; color: #555;">...</p>
          </div>
        </div>
        
        <button class="edit-profile-btn" id="edit-profile-btn" style="display: none;" onclick="openEditProfileModal()">Edit Helper Profile</button>
      </div>
    </div>
    
    <!-- Bookings Board -->
    <div class="bookings-section">
      <div class="section-header">
        <h2>My Bookings</h2>
        <span id="booking-count-badge" style="background:#0077ff; color:white; padding:4px 10px; border-radius:10px; font-size:12px; font-weight:600">0 Total</span>
      </div>
      
      <div class="booking-list" id="bookings-list-container">
        <div class="loader-container">
          <div class="loader"></div>
          <p style="margin-top: 15px; color: #666;">Loading bookings...</p>
        </div>
      </div>
    </div>
    
  </div>

  <!-- Edit Profile Modal (Helpers Only) -->
  <div class="modal-backdrop" id="edit-profile-modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeEditProfileModal()">&times;</button>
      <h3 class="modal-title">Edit Profile</h3>
      
      <form id="profile-edit-form" onsubmit="handleProfileUpdate(event)">
        
        <div class="modal-form-group">
          <label for="edit-service">Service Type</label>
          <select id="edit-service" required>
            <option value="Plumber">Plumber</option>
            <option value="Electrician">Electrician</option>
            <option value="Cleaner">Cleaner</option>
            <option value="Carpenter">Carpenter</option>
            <option value="Painter">Painter</option>
          </select>
        </div>
        
        <div class="modal-form-group">
          <label for="edit-experience">Experience (Years)</label>
          <input type="number" id="edit-experience" min="0" required>
        </div>
        
        <div class="modal-form-group">
          <label for="edit-rate">Hourly Rate (₹)</label>
          <input type="number" id="edit-rate" min="0" required>
        </div>
        
        <div class="modal-form-group">
          <label for="edit-location">Location City</label>
          <input type="text" id="edit-location" required>
        </div>
        
        <div class="modal-form-group">
          <label for="edit-desc">Short Professional Description</label>
          <textarea id="edit-desc" rows="4" required></textarea>
        </div>
        
        <div class="modal-form-group">
          <label for="edit-avatar">Profile Avatar URL</label>
          <input type="url" id="edit-avatar">
        </div>
        
        <button type="submit" class="modal-submit-btn">Save Changes</button>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast-notification">
    <span id="toast-message"></span>
  </div>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
